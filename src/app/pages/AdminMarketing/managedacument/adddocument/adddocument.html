<app-header></app-header>
<app-sidebar></app-sidebar>
<app-pageheader
  [title]="headerTitle"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>

<app-form
  [title]="isEditMode ? 'Edit Document' : 'Add New Document'"
  [fields]="documentFields"
  [model]="formInitialData"
  (formSubmit)="saveDocument($event)"
  (cancelForm)="onCancel()">
</app-form>
