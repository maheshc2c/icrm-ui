<app-header></app-header>
<app-sidebar></app-sidebar>

<app-pageheader
[title]="headerTitle"
[breadcrumbs]="headerBreadcrumbs"></app-pageheader>


<app-data-table
  title="Manage Specialities"
  [columns]="columns"
  [rows]="rows"
  [searchFields]="searchFields"
  [showImport]="false"
  [showAdd]="true"
  [showStatusToggle]="true"
  (search)="onSearch($event)"
  (add)="onAdd()"
  (editRow)="onEdit($event)"
  (deleteRow)="onDelete($event)"
  (statusToggle)="onStatusToggle($event)"
  (download)="onDownload()">
</app-data-table>
