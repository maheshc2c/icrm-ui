<app-header></app-header>
<app-toast></app-toast>
<app-sidebar></app-sidebar>
<app-pageheader
  [title]="'Admin MarketingDashboard'"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>
 
 
<div class="dashboard-content">
  <!-- First Row: Manage, Documents, and Leads -->
  <div class="section-row">
      <!-- Manage Section -->
      <div class="section-block">
        <div class="section-header-title">
          <i class="fas fa-building"></i>
          <span>Manage Campaign</span>
        </div>
        <div class="section-cards">
          <div class="dashboard-card campaign-card">
            <a routerLink="/adminmarketing/compaign">
              <div class="card-header">
                <div class="card-icon campaign-bg">
                  <i class="fas fa-building"></i>
                </div>
                <div class="card-title">
                  <h3>Campaign</h3>
                </div>
              </div>
            </a>
          </div>
        </div>
      </div>
 
      <!-- Documents Section -->
      <div class="section-block">
        <div class="section-header-title">
          <i class="fas fa-upload"></i>
          <span>Documents</span>
        </div>
        <div class="section-cards">
          <div class="dashboard-card document-card">
            <a routerLink="/adminmarketing/managedacument">
              <div class="card-header">
                <div class="card-icon document-bg">
                  <i class="fas fa-upload"></i>
                </div>
                <div class="card-title">
                  <h3>Upload Documents</h3>
                </div>
              </div>
            </a>
          </div>
        </div>
      </div>
 
      <!-- Leads Section -->
      <div class="section-block">
        <div class="section-header-title">
          <i class="fas fa-user-tag"></i>
          <span>Leads</span>
        </div>
        <div class="section-cards">
          <div class="dashboard-card leads-card">
            <a routerLink="/adminmarketing/assing-leads">
              <div class="card-header">
                <div class="card-icon leads-assign-bg">
                  <i class="fas fa-check-square"></i>
                </div>
                <div class="card-title">
                  <h3>Assign Leads</h3>
                </div>
              </div>
            </a>
          </div>
          <div class="dashboard-card leads-card">
            <a routerLink="/adminmarketing/track-leads">
              <div class="card-header">
                <div class="card-icon leads-track-bg">
                  <i class="fas fa-calendar"></i>
                </div>
                <div class="card-title">
                  <h3>Track Leads</h3>
                </div>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
 
  <!-- Second Row: Manage Customer Details -->
  <div class="section-row">
    <!-- Manage Customer Details Section -->
    <div class="section-block">
      <div class="section-header-title">
        <i class="fas fa-users"></i>
        <span>Manage Customer</span>
      </div>
      <div class="section-cards">
        <div class="dashboard-card customer-card">
          <a routerLink="/adminmarketing/customer">
            <div class="card-header">
              <div class="card-icon customer-bg">
                <i class="fas fa-user"></i>
              </div>
              <div class="card-title">
                <h3>Customer</h3>
              </div>
            </div>
          </a>
        </div>
        <div class="dashboard-card contact-card">
          <a routerLink="/adminmarketing/contact">
            <div class="card-header">
              <div class="card-icon contact-bg">
                <i class="fas fa-book"></i>
              </div>
              <div class="card-title">
                <h3>Contact</h3>
              </div>
            </div>
          </a>
        </div>
        <div class="dashboard-card speciality-card">
          <a routerLink="/speciality">
            <div class="card-header">
              <div class="card-icon speciality-bg">
                <i class="fas fa-star"></i>
              </div>
              <div class="card-title">
                <h3>Speciality</h3>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
