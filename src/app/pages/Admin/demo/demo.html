<app-header></app-header>
<app-sidebar></app-sidebar>

<app-pageheader
[title]="headerTitle"
[breadcrumbs]="headerBreadcrumbs"
></app-pageheader>

<app-data-table
[columns]="columns"
[rows]="rows"
[showImport]="true"
[showAdd]="true"
[showStatusToggle]="true"
[searchFields]="searchFields"
(add)="onAdd()"
(download)="onImport()"
(editRow)="onEdit($event)"
(search)="onSearch($event)"
(deleteRow)="onDelete($event)"
[showStatusToggle]="true"
  [statusField]="'demoProductDetailStatus'"
  [trackByField]="'demoProductDetailId'"
>
</app-data-table>
