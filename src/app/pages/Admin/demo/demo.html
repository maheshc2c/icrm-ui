<app-header></app-header>
<app-sidebar></app-sidebar>

<app-pageheader
[title]="headerTitle"
[breadcrumbs]="headerBreadcrumbs"
></app-pageheader>

<app-data-table title="Manage Demo Product" [columns]="columns" [rows]="rows" [showSearch]="true" [showImport]="false"
  [showAdd]="true" [showEdit]="true" [showDelete]="true" [showAssign]="false" [showUpload]="false"
  [showDownload]="true" [searchFields]="searchFields" [showRefresh]="true" [showStatusToggle]="true"
  (add)="onAdd()" (editRow)="onEdit($event)" (deleteRow)="onDelete($event)" (search)="onSearch($event)"
  (download)="onImport()" (refresh)="onRefresh()"
  [statusField]="'demoProductDetailStatus'" [trackByField]="'demoProductDetailId'"
  [showPagination]="true" [currentPage]="currentPage" [totalPages]="totalPages" 
  [totalItems]="totalItems" [pageSize]="pageSize"
  (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
</app-data-table>
