<app-header></app-header>
<app-sidebar></app-sidebar>

<app-pageheader [title]="headerTitle" [breadcrumbs]="headerBreadcrumbs"></app-pageheader>

<app-data-table [columns]="columns" 
[rows]="rows" [searchFields]="searchFields" 
(add)="onAdd()" 
(editRow)="onEdit($event)"
  (deleteRow)="onDelete($event)"
(download)="onImport()"

    [showStatusToggle]="true"
  [statusField]="'contactStatus'"
  [trackByField]="'contactId'">
</app-data-table>
