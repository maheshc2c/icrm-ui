<app-header></app-header>
<app-sidebar></app-sidebar>
<app-pageheader [title]="headerTitle" [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>

<app-data-table title="👥 Target Role List" [columns]="columns" [rows]="rows" [showSearch]="true" [showImport]="false"
    [showAdd]="false" [showEdit]="false" [showDelete]="false" [showAssign]="true" [showUpload]="true"
    [showDownload]="false" [showRefresh]="true"
    [searchFields]="searchFields" (searchChange)="onSearchFromChild($event)" 
    (refresh)="onRefresh()"
    (add)="onAdd()" (assignRow)="onAssign($event)"
    (uploadRow)="onUpload($event)"
    [showPagination]="true" [currentPage]="currentPage" [totalPages]="totalPages" 
    [totalItems]="totalItems" [pageSize]="pageSize"
    (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
</app-data-table>
