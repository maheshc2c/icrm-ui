<app-header></app-header>
<app-sidebar></app-sidebar>
<app-pageheader [title]="headerTitle" [breadcrumbs]="headerBreadcrumbs"></app-pageheader>

<main class="content">
    <div class="upload-card">

        <!-- Top Bar -->
        <div class="card-top-bar">
            <h2 class="card-title">
                Product Targets For {{ selectedYear }} Financial Year
            </h2>
            <button class="btn btn-download" (click)="onDownloadTemplate()">
                <i class="fas fa-download"></i> Download User Product Targets XLS
            </button>
        </div>

        <!-- Upload Form -->
        <div class="upload-form-body">
            <div class="form-row">
                <label class="upload-label">Upload File<span class="required">*</span></label>
                <div class="upload-input-group">
                    <input type="file" id="fileInput" class="file-input" accept=".csv" (change)="onFileChange($event)">
                    <span class="file-hint">(allowed csv files only)</span>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary submit-btn" (click)="onSubmit()"
                    [disabled]="isSubmitting || !selectedFile">
                    {{ isSubmitting ? 'Uploading...' : 'Submit' }}
                </button>
            </div>
        </div>

    </div>
</main>
