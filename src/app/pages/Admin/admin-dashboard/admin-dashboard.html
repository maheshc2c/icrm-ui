<app-header></app-header>
<app-sidebar></app-sidebar>
<app-pageheader
  [title]="'Admin Dashboard'"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>


<div class="dashboard-content">

  <!-- First Row -->
  <div class="section-row">

    <!-- Manage -->
    <div class="section-block">
      <div class="section-header-title">
        <i class="fas fa-users"></i>
        <span>Manage User</span>
      </div>

      <div class="section-cards">
        <div class="dashboard-card users-card">
          <a routerLink="/users">
            <div class="card-header">
              <div class="card-icon users-bg">
                <i class="fas fa-users"></i>
              </div>
              <div class="card-title">
                <h3>Users</h3>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>

    <!-- Manage Product Details -->
    <div class="section-block">
      <div class="section-header-title">
        <i class="fas fa-book"></i>
        <span>Manage Product Details</span>
      </div>

      <div class="section-cards">
        <div class="dashboard-card category-card">
          <a routerLink="/admin/category">
            <div class="card-header">
              <div class="card-icon category-bg">
                <i class="fab fa-dropbox"></i>
              </div>
              <div class="card-title">
                <h3>Category</h3>
              </div>
            </div>
          </a>
        </div>

        <div class="dashboard-card group-card">
          <a routerLink="/segment">
            <div class="card-header">
              <div class="card-icon group-bg">
                <i class="fas fa-qrcode"></i>
              </div>
              <div class="card-title">
                <h3>Segment</h3>
              </div>
            </div>
          </a>
        </div>

        <div class="dashboard-card products-card">
          <a routerLink="/product">
            <div class="card-header">
              <div class="card-icon products-bg">
                <i class="fas fa-list-alt"></i>
              </div>
              <div class="card-title">
                <h3>Products</h3>
              </div>
            </div>
          </a>
        </div>

        <div class="dashboard-card competitor-card">
          <a routerLink="/competitor">
            <div class="card-header">
              <div class="card-icon competitor-bg">
                <i class="fas fa-thumbs-up"></i>
              </div>
              <div class="card-title">
                <h3>Competitor</h3>
              </div>
            </div>
          </a>
        </div>

        <div class="dashboard-card demo-card">
          <a routerLink="/demoproduct">
            <div class="card-header">
              <div class="card-icon demo-bg">
                <i class="fas fa-suitcase"></i>
              </div>
              <div class="card-title">
                <h3>Demo</h3>
              </div>
            </div>
          </a>
        </div>

        <div class="dashboard-card user-target-card">
          <a routerLink="/user-target">
            <div class="card-header">
              <div class="card-icon user-target-bg">
                <i class="fas fa-list-ol"></i>
              </div>
              <div class="card-title">
                <h3>User-Target</h3>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Second Row -->
  <div class="section-row">

    <!-- Manage Customers -->
    <div class="section-block">
      <div class="section-header-title">
        <i class="fas fa-users"></i>
        <span>Manage Customers</span>
      </div>

      <div class="section-cards">
        <div class="dashboard-card customer-card">
          <a routerLink="/customer">
            <div class="card-header">
              <div class="card-icon customer-bg">
                <i class="fas fa-user"></i>
              </div>
              <div class="card-title">
                <h3>Customer</h3>
              </div>
            </div>
          </a>
        </div>

        <div class="dashboard-card contact-card">
          <a routerLink="/contact">
            <div class="card-header">
              <div class="card-icon contact-bg">
                <i class="fas fa-book"></i>
              </div>
              <div class="card-title">
                <h3>Contact</h3>
              </div>
            </div>
          </a>
        </div>

        <div class="dashboard-card specialty-card">
          <a routerLink="/speciality">
            <div class="card-header">
              <div class="card-icon specialty-bg">
                <i class="fas fa-star"></i>
              </div>
              <div class="card-title">
                <h3>Speciality</h3>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>

    <!-- Territory -->
    <div class="section-block">
      <div class="section-header-title">
        <i class="fas fa-hospital"></i>
        <span>Territory</span>
      </div>

      <div class="section-cards">
        <div class="dashboard-card city-card">
          <a routerLink="/city">
            <div class="card-header">
              <div class="card-icon city-bg">
                <i class="fas fa-thumbtack"></i>
              </div>
              <div class="card-title">
                <h3>City/Town</h3>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>

    <!-- Discount -->
    <div class="section-block">
      <div class="section-header-title">
        <i class="fas fa-percent"></i>
        <span>Discount</span>
      </div>

      <div class="section-cards">
        <div class="dashboard-card quote-card">
          <a routerLink="/discountqoute">
            <div class="card-header">
              <div class="card-icon quote-bg">
                <i class="fas fa-file-alt"></i>
              </div>
              <div class="card-title">
                <h3>Quote</h3>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>

    <!-- Inactive -->
    <div class="section-block">
      <div class="section-header-title">
        <i class="fas fa-exclamation-triangle"></i>
        <span>Inactive</span>
      </div>

      <div class="section-cards">
        <div class="dashboard-card leads-card">
          <a routerLink="/admin/leads">
            <div class="card-header">
              <div class="card-icon leads-bg">
                <i class="fas fa-exclamation-triangle"></i>
              </div>
              <div class="card-title">
                <h3>Leads</h3>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>

  </div>
</div>
