<app-header></app-header>
<app-sidebar></app-sidebar>
<app-pageheader
  [title]="'Admin Dashboard'"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>


<div class="dashboard-content">

  <!-- First Row -->
  <div class="section-row">

    <!-- Manage -->
    <div class="section-block">
      <div class="section-header-title">
        <i class="fas fa-users-cog"></i>
        <span>Manage</span>
      </div>

      <div class="section-cards">
        <div class="dashboard-card users-card">
          <a routerLink="/admin/manage-users">
            <div class="card-header">
              <div class="card-icon users-bg">
                <i class="fas fa-users"></i>
              </div>
              <div class="card-title">
                <h3>Users</h3>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>

    <!-- Manage Product Details -->
    <div class="section-block">
      <div class="section-header-title">
        <i class="fas fa-clipboard-list"></i>
        <span>Manage Product Details</span>
      </div>

      <div class="section-cards">
        <div class="dashboard-card category-card">
          <a routerLink="/admin/category">
            <div class="card-header">
              <div class="card-icon category-bg">
                <i class="fas fa-th-large"></i>
              </div>
              <div class="card-title">
                <h3>Category</h3>
              </div>
            </div>
          </a>
        </div>

        <div class="dashboard-card group-card">
          <a routerLink ="/admin/segment">
            <div class="card-header">
              <div class="card-icon group-bg">
                <i class="fas fa-layer-group"></i>
              </div>
              <div class="card-title">
                <h3>Group</h3>
              </div>
            </div>
          </a>
        </div>
        

        <div class="dashboard-card products-card">
          <a routerLink="/admin/product">
            <div class="card-header">
              <div class="card-icon products-bg">
                <i class="fas fa-box"></i>
              </div>
              <div class="card-title">
                <h3>Products</h3>
              </div>
            </div>
          </a>
        </div>

        <div class="dashboard-card competitor-card">
          <a routerLink="/admin/competitor">
            <div class="card-header">
              <div class="card-icon competitor-bg">
                <i class="fas fa-chart-line"></i>
              </div>
              <div class="card-title">
                <h3>Competitor</h3>
              </div>
            </div>
          </a>
        </div>

        <div class="dashboard-card demo-card">
          <a routerLink="/admin/demo">
            <div class="card-header">
              <div class="card-icon demo-bg">
                <i class="fas fa-laptop"></i>
              </div>
              <div class="card-title">
                <h3>Demo</h3>
              </div>
            </div>
          </a>
        </div>

        <div class="dashboard-card user-target-card">
          <a routerLink="/admin/user-target">
            <div class="card-header">
              <div class="card-icon user-target-bg">
                <i class="fas fa-bullseye"></i>
              </div>
              <div class="card-title">
                <h3>User-Target</h3>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Second Row -->
  <div class="section-row">

    <!-- Manage Customers -->
    <div class="section-block">
      <div class="section-header-title">
        <i class="fas fa-users"></i>
        <span>Manage Customers</span>
      </div>

      <div class="section-cards">
        <div class="dashboard-card customer-card">
          <a routerLink="/customer">
            <div class="card-header">
              <div class="card-icon customer-bg">
                <i class="fas fa-user-friends"></i>
              </div>
              <div class="card-title">
                <h3>Customer</h3>
              </div>
            </div>
          </a>
        </div>

        <div class="dashboard-card contact-card">
          <a routerLink="/contact">
            <div class="card-header">
              <div class="card-icon contact-bg">
                <i class="fas fa-address-book"></i>
              </div>
              <div class="card-title">
                <h3>Contact</h3>
              </div>
            </div>
          </a>
        </div>

        <div class="dashboard-card specialty-card">
          <a routerLink="/admin/speciality">
            <div class="card-header">
              <div class="card-icon specialty-bg">
                <i class="fas fa-star"></i>
              </div>
              <div class="card-title">
                <h3>Speciality</h3>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>

    <!-- Territory -->
    <div class="section-block">
      <div class="section-header-title">
        <i class="fas fa-map-marked-alt"></i>
        <span>Territory</span>
      </div>

      <div class="section-cards">
        <div class="dashboard-card city-card">
          <a routerLink="/city">
            <div class="card-header">
              <div class="card-icon city-bg">
                <i class="fas fa-city"></i>
              </div>
              <div class="card-title">
                <h3>City/Town</h3>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>

    <!-- Discount -->
    <div class="section-block">
      <div class="section-header-title">
        <i class="fas fa-percent"></i>
        <span>Discount</span>
      </div>

      <div class="section-cards">
        <div class="dashboard-card quote-card">
          <a routerLink="/discountqoute">
            <div class="card-header">
              <div class="card-icon quote-bg">
                <i class="fas fa-file-alt"></i>
              </div>
              <div class="card-title">
                <h3>Quote</h3>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>

    <!-- Inactive -->
    <div class="section-block">
      <div class="section-header-title">
        <i class="fas fa-ban"></i>
        <span>Inactive</span>
      </div>

      <div class="section-cards">
        <div class="dashboard-card leads-card">
          <a routerLink="/admin/leads">
            <div class="card-header">
              <div class="card-icon leads-bg">
                <i class="fas fa-inbox"></i>
              </div>
              <div class="card-title">
                <h3>Leads</h3>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>

  </div>
</div>
