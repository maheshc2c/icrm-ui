<app-header></app-header>
<app-sidebar></app-sidebar>
<app-pageheader
  [title]="headerTitle"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>

<app-form
  [title]="isEditMode ? 'Edit District' : 'Add New District'"
  [fields]="districtFields"
  [model]="model"
  (formSubmit)="saveDistrict($event)"
  (cancelForm)="onCancel()">
</app-form>
