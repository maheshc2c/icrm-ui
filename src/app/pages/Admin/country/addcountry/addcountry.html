<app-header></app-header>
<app-sidebar></app-sidebar>
<app-pageheader
  [title]="headerTitle"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>

<div class="add-country-container">
  <div class="card">
    <div class="card-body">
      <app-form
        [fields]="countryFields"
        [model]="model"
         [title]="isEditMode ? 'Update' : 'Submit'"
        (formSubmit)="saveCountry($event)"
        (cancelForm)="onCancel()">
      </app-form>
    </div>
  </div>
</div>
