<app-header></app-header>
<app-sidebar></app-sidebar>
<app-pageheader
  [title]="headerTitle"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>

<div class="add-state-container">
  <div class="card">
    <div class="card-body">
      <app-form
   
        [fields]="stateFields"
        [model]="model"
        [title]="isEditMode ? 'Update' : 'Submit'"

        (formSubmit)="saveState($event)"
        (cancelForm)="onCancel()">
      </app-form>

    </div>
  </div>
</div>
