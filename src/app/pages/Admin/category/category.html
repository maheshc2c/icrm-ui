<app-header></app-header>
<app-sidebar></app-sidebar>
<app-pageheader
  [title]="headerTitle"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>

<app-data-table
  title="Category List"
  [columns]="columns"
  [rows]="rows"
  [searchFields]="searchFields"
  (searchChange)="onSearch($event)" 
  [showImport]="true"
  [showAdd]="true"
  (download)="onImport()"
  (add)="onAdd()"
  (editRow)="onEdit($event)"
  [showStatusToggle]="true"
  (deleteRow)="onDelete($event)">
</app-data-table>
