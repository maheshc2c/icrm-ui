<app-header></app-header>
<app-sidebar></app-sidebar>
<app-pageheader
  [title]="headerTitle"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>

<app-form

  [title]="isEditMode ? 'Edit Company' : 'Add New Company'"
  [fields]="companyFields"
  [model]="formInitialData"
  (formSubmit)="saveCompany($event)"
  (cancelForm)="onCancel()">
</app-form>
