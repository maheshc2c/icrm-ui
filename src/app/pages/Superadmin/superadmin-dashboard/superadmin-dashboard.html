<app-header></app-header>
<app-sidebar></app-sidebar>
<app-pageheader
  [title]="'SuperAdmin Dashboard'"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>


<div class="dashboard-content">

  <!-- First Row -->
  <div class="section-row">

    <!-- Manage Admin User -->
    <div class="section-block">
      <div class="section-header-title">
        <i class="fas fa-user"></i>
        <span>Manage Admin User</span>
      </div>

      <div class="section-cards">
        <div class="dashboard-card users-card">
          <a routerLink="/superadmin/manage-users">
            <div class="card-header">
              <div class="card-icon users-bg">
                <i class="fas fa-user"></i>
              </div>
              <div class="card-title">
                <h3>Admin User</h3>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>


    <!-- Manage Company -->
    <div class="section-block">
      <div class="section-header-title">
        <i class="fas fa-building"></i>
        <span>Manage Companies</span>
      </div>

      <div class="section-cards">
        <div class="dashboard-card city-card">
           <a routerLink="/superadmin/company">
            <div class="card-header">
              <div class="card-icon city-bg">
                <i class="fas fa-building"></i>
              </div>
              <div class="card-title">
                <h3>Company</h3>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>

  </div>
</div>
