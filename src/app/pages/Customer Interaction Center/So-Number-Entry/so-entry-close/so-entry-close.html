
 <app-header></app-header>
<app-sidebar></app-sidebar>

<app-pageheader
  [title]="headerTitle"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>

<app-data-table
  title="Campaign List"
  [columns]="columns"
  [rows]="rows"
  [showReset]="true"
  [showAdd]="false"
  [showDelete]="true"
  [showDownload]="true"
  [searchFields]="searchFields"
  [showEdit]="false"
  [showDelete]="false"
  [showPagination]="true"
  [totalElements]="totalElements"
  [pageSize]="pageSize"
  [showActions]="false"
  [showSno]="false"
  [currentPage]="currentPage"
  [totalPages]="totalPages"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  (searchChange)="onSearch($event)"   
  (import)="onImport()"
  (deleteRow)="onDelete($event)"
  (cellChange)="onCellChange($event)"
  (download)="onBulkDownload()"
  (downloadRow)="onDownload($event)">
</app-data-table>
