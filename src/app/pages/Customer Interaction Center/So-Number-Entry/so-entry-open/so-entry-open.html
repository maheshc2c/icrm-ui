 <app-header></app-header>
<app-sidebar></app-sidebar>

<app-pageheader
  [title]="headerTitle"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>

<app-data-table
  [title]="headerTitle"
  [columns]="columns"
  [rows]="rows"
  [searchFields]="searchFields"
  [showReset]="true"
  [showRefresh]="false"
  [showDownload]="true"
  [showBulkUpload]="true"
  [showSubmit]="true"
  [showPagination]="true"
  [totalElements]="totalElements"
  [pageSize]="pageSize"
  [currentPage]="currentPage"
  [totalPages]="totalPages"
  [showActions]="false"
  [showSno]="false"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  (searchChange)="onSearch($event)"
  (refresh)="onRefresh()"
  (import)="onImport()"
  (editRow)="onEdit($event)"
  (deleteRow)="onDelete($event)"
  (cellChange)="onCellChange($event)"
  (download)="onDownload()"
  (downloadRow)="onDownloadRow($event)"
  (bulkUpload)="onUpload()"
  (submit)="onSubmit()">
</app-data-table>



<!-- BULK UPLOAD MODAL -->
<div class="modal-backdrop" *ngIf="bulkUploadModalVisible">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Bulk Upload SO Entries</h3>
      <button class="close-button" (click)="closeBulkUpload()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="upload-section">
        <h4>Select File</h4>
        <div class="file-input-container">
          <input
            type="file"
            #fileInput
            style="display: none"
            accept=".xlsx,.xls,.csv"
            (change)="onFileSelected($event)" />
          <button class="choose-file-btn" (click)="fileInput.click()">Choose File</button>
          <span class="file-display">{{ selectedFileName || 'No file chosen' }}</span>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" (click)="closeBulkUpload()">Cancel</button>
      <button class="btn-submit" (click)="submitBulkUpload()">Submit</button>
    </div>
  </div>
</div>
