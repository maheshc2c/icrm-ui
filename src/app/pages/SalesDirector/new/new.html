<app-header></app-header>
<app-sidebar></app-sidebar>

<app-pageheader
  [title]="isEditMode ? 'Edit Lead' : 'Create a new Lead'"
  [breadcrumbs]="breadcrumbs">
</app-pageheader>

<div class="top-action-buttons">
  <button type="button" class="lead-action-btn" (click)="onAddCustomer()">+ Add Customer</button>
  <button type="button" class="lead-action-btn" (click)="onAddContact()">+ Add Contact</button>
</div>

<app-form
  [title]="isEditMode ? 'Update Lead Details' : 'Enter the Below Details'"
  [fields]="leadFields"
  [model]="leadForm"
  (formSubmit)="onSubmit($event)"
  (cancelForm)="onCancel()"
  (addCustomer)="onAddCustomer()"
  (addContact)="onAddContact()">
</app-form>
