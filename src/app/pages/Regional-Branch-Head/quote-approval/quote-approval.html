<app-header></app-header>

<app-sidebar></app-sidebar>

<app-pageheader
  [title]="headerTitle"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>

<app-data-table
  [columns]="columns"
  [rows]="rows"

  [showAdd]="false"
  [showDownload]="false"
  [showEdit]="false"
  [showDelete]="false"
  [showView]="true"
  [searchFields]="searchFields"
  (search)="onSearch()"

  (viewRow)="onView($event)">
</app-data-table>
