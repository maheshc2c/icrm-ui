<app-header></app-header>

<app-sidebar></app-sidebar>

<app-pageheader
  [title]="headerTitle"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>

<app-data-table
  [columns]="columns"
  [rows]="rows"
  [showAdd]="false"
  [showDownload]="false"
  [showEdit]="true"
  [showDelete]="false"
  [showView]="true"
    [showReset]="true"
  (reset)="onReset()"
  [searchFields]="searchFields"
  (search)="onSearch()"
  (editRow)="onEdit($event)"
  (viewRow)="onView($event)">
</app-data-table>
