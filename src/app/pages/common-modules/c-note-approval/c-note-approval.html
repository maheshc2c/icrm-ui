<app-header></app-header>

<app-sidebar></app-sidebar>

<app-pageheader
  [title]="headerTitle"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>

<app-data-table
  [columns]="columns"
  [rows]="rows"

  [totalElements]="totalElements"
  [totalPages]="totalPages"
  [currentPage]="currentPage + 1"
  [pageSize]="pageSize"
  (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"

  [showAdd]="false"
  [showDownload]="false"
  [showEdit]="false"
  [showApprove]="true"
  (approveRow)="approveContractNote($event)"
  [showReject]="false"
  [showDelete]="false"
  [showReset]="true"
  (downloadRow)="onDownloadRow($event)"
  (reset)="onReset()"
  [searchFields]="searchFields"
  (searchChange)="onSearch($event)"
  (editRow)="onEdit($event)">
</app-data-table>

<!-- (rejectRow)="rejectContractNote($event)" -->
