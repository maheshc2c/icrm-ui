<app-header></app-header>
<app-sidebar></app-sidebar>

<app-pageheader
  [title]="headerTitle"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>

<app-form
  [title]="isEditMode ? 'Edit Contact' : 'Add Contact'"
  [fields]="contactFields"
  [model]="formInitialData"
  (formSubmit)="saveContact($event)"
  (cancelForm)="onCancel()">
</app-form>
