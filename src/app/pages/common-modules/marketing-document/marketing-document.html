<app-header></app-header>
<app-sidebar></app-sidebar>
<app-pageheader
  [title]="headerTitle"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>

<app-data-table
  title="Documents List"
  [columns]="columns"
  [rows]="rows"
  [searchFields]="searchFields"
  [showImport]="false"
  [showAdd]="isAdminMarketing"
  [showEdit]="isAdminMarketing"
  [showDelete]="isAdminMarketing"
  [showStatusToggle]="isAdminMarketing"
  [showActions]="isAdminMarketing"
  [statusField]="'specialityStatus'"
  [trackByField]="'id'"
  [totalElements]="totalElements"
  [currentPage]="currentPage"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  (searchChange)="onSearchChange($event)"
  (search)="onSearch($event)"
  (download)="onDownload()"
  (add)="onAdd()"
  (editRow)="onEdit($event)"
  (deleteRow)="onDelete($event)"
  (downloadRow)="onDownloadDocument($event)"
  [showReset]="true"
  (reset)="onReset()">
</app-data-table>
