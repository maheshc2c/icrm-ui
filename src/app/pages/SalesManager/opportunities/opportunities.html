<app-header></app-header>
<app-sidebar></app-sidebar>

<app-pageheader
  [title]="headerTitle"
  [breadcrumbs]="headerBreadcrumbs">
</app-pageheader>

<app-data-table
  [columns]="columns"
  [rows]="filteredOpportunities"
  [searchFields]="searchFields"
  [showImport]="true"
  [showAdd]="true"
  (searchChange)="onSearchChange($event)"
  (search)="onSearch()"
  (download)="downloadExcel()"
  (add)="onAdd()"
  (editRow)="onEdit($event)">
</app-data-table>

<!-- ADD/EDIT OPPORTUNITY MODAL -->
<app-modal [show]="showAddModal" [title]="isEditMode ? 'Edit Opportunity' : 'Add New Opportunity'" (closeDialog)="closeModal()">
  <div class="opportunity-form-grid">
    <div class="form-field-group" *ngFor="let field of oppFields">
      <label [for]="field.name">{{ field.label }} <span *ngIf="field.required" class="required">*</span></label>
      
      <select *ngIf="field.type === 'select'" [(ngModel)]="oppModel[field.name]" [id]="field.name" class="form-control" (ngModelChange)="onFieldChange(field.name, $event)">
        <option value="" disabled selected>Choose {{ field.label }}</option>
        <option *ngFor="let opt of field.options" [value]="opt.value">{{ opt.label }}</option>
      </select>

      <input *ngIf="field.type === 'number'" type="number" [(ngModel)]="oppModel[field.name]" [id]="field.name" class="form-control" [placeholder]="'Enter ' + field.label">
      
      <input *ngIf="field.type === 'text'" type="text" [(ngModel)]="oppModel[field.name]" [id]="field.name" class="form-control" [placeholder]="'Enter ' + field.label">
      
      <input *ngIf="field.type === 'date'" type="date" [(ngModel)]="oppModel[field.name]" [id]="field.name" class="form-control">
    </div>
  </div>

  <div class="modal-footer">
    <button class="btn-cancel" (click)="closeModal()">Cancel</button>
    <button class="btn-submit" (click)="onSubmitOpp(oppModel)">Submit</button>
  </div>
</app-modal>
