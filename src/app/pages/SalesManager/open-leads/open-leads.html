<app-header></app-header>
<app-sidebar></app-sidebar>

<app-pageheader
  title="Open Leads"
  [breadcrumbs]="breadcrumbs">
</app-pageheader>

<app-data-table
  [columns]="columns"
  [rows]="rows"
  [searchFields]="searchFields"
  (searchChange)="onSearch($event)"
  [showImport]="true"
  [showAdd]="true"
  [showPagination]="true"
  (download)="onDownload()"
  (add)="onAdd()"
  (editRow)="onEdit($event)">
</app-data-table>
