<app-header></app-header>
<app-sidebar></app-sidebar>

<app-pageheader
  title="Open Leads"
  [breadcrumbs]="breadcrumbs">
</app-pageheader>

<app-data-table
  [columns]="columns"
  [rows]="rows"
  [searchFields]="searchFields"
  (searchChange)="onSearch($event)"
  [showImport]="true"
  [showAdd]="true"
  [showReset]="true"
  [showDelete]="false"
  [showPagination]="true"
  [totalElements]="totalElements"
  [currentPage]="currentPage"
  [pageSize]="pageSize"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  (reset)="onReset()"
  (download)="onDownload()"
  (add)="onAdd()"
  tableClass="open-leads-table"
  (editRow)="onEdit($event)">
  
</app-data-table>
