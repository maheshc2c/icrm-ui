<app-header></app-header>
<app-sidebar></app-sidebar>
<div class="content-wrapper" style="background-color: #f8f9fa; min-height: calc(100vh - 60px);">
  <div style="padding: 24px 30px; margin-left: 287px;">
    <app-data-table
      title="Manage Contact"
      [breadcrumbs]="breadcrumbs"
      [columns]="columns"
      [rows]="rows"
      [searchFields]="searchFields"
      (searchChange)="onSearch($event)"
      [showImport]="true"
      [showAdd]="true"
      (download)="onDownload()"
      (add)="onAdd()"
      (editRow)="onEdit($event)">
    </app-data-table>
  </div>
</div>
