<div class="login-page">
  <div class="wing-left"></div>
  <div class="wing-right"></div>

  <div class="login-container">
    <div class="image-section">
      <img
        class="aircraft-image"
        src="assets/images/Gemini_Generated_Image_p6eqnqp6eqnqp6eq.png"
        alt="ICRM"
      />
    </div>

    <div class="form-section">
      <div class="logo-container">
        <img
          src="assets/images/Gemini_Generated_Image_j4oc6rj4oc6rj4oc-removebg-preview.png"
          alt="Logo"
          class="l"
        />
      </div>

      <!-- Alert Container -->
      <div class="alert-container" *ngIf="successMessage || errorMessage">
        <div class="alert alert-success" *ngIf="successMessage">
          <i class="fas fa-check-circle"></i>
          <span>{{ successMessage }}</span>
        </div>
        <div class="alert alert-danger" *ngIf="errorMessage">
          <i class="fas fa-exclamation-circle"></i>
          <span>{{ errorMessage }}</span>
        </div>
      </div>

      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <div class="form-group">
          <label for="username">Employee ID</label>
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="username"
            [disabled]="isLoading"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            [disabled]="isLoading"
            required
          />
        </div>

        <button type="submit" class="login-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading">Login</span>
          <span *ngIf="isLoading" class="spinner-container">
            <span class="spinner"></span>
            <span>Logging in...</span>
          </span>
        </button>
      </form>

      <div>
        <a routerLink="/forgotpassword" class="forgot-password">Forgot Password</a>
      </div>
    </div>
  </div>
</div>
