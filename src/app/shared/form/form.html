<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<app-header></app-header>
<app-sidebar></app-sidebar>

<div class="form-wrapper">
  <div class="company-form-container">

    <div class="form-header-block" style="background: #fff; border-bottom: none; padding-bottom: 0;">
      <h4 class="form-title-heading" style="color: #333; font-weight: 600;">{{ title }}</h4>
      <div class="header-action-buttons" style="display: flex; gap: 10px;">
        <!-- New Top Buttons -->
        <button *ngIf="showDetailsButton" type="button" class="action-header-btn" style="background: #2196f3; color: white; border: none; border-radius: 4px; padding: 6px 14px; font-size: 13px; cursor: pointer;" (click)="clickDetails.emit()">
          <i class="fas fa-info-circle"></i> Details
        </button>
        <button *ngIf="showDropLeadButton" type="button" class="action-header-btn" style="background: #f44336; color: white; border: none; border-radius: 4px; padding: 6px 14px; font-size: 13px; cursor: pointer;" (click)="clickDropLead.emit()">
          <i class="fas fa-trash-alt"></i> Drop Lead
        </button>

        <!-- Installed Base Button -->
        <button *ngIf="showInstalledBaseButton" type="button" class="action-header-btn" style="background: #3b82f6; color: white; border: none; border-radius: 4px; padding: 6px 14px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px;" (click)="clickInstalledBase.emit()">
          <i class="fas fa-database"></i> Installed Base
        </button>

        <!-- Existing Add Buttons -->
        <button *ngIf="showAddCustomerButton" type="button" class="action-header-btn btn-add-customer" (click)="addCustomer.emit()">
          <i class="fas fa-plus"></i> Add Customer
        </button>
        <button *ngIf="showAddContactButton" type="button" class="action-header-btn btn-add-contact" (click)="addContact.emit()">
          <i class="fas fa-plus"></i> Add Contact
        </button>
      </div>
    </div>

    <div class="form-body-section">
      <form (ngSubmit)="submit()">

        <!-- LOOP ALL FIELDS -->
        <div class="company-field-row" *ngFor="let field of fields">

          <!-- LABEL -->
          <label class="field-label-text">
            {{ field.label }}
            <span *ngIf="field.required" class="mandatory-star">*</span>
          </label>

            <!-- DATE -->
            <input *ngIf="field.type === 'date'" type="date" class="company-text-input"
              [(ngModel)]="formData[field.name]" [name]="field.name" [disabled]="readOnly" />
 
            <!-- DATETIME-LOCAL -->
            <input *ngIf="field.type === 'datetime-local'" type="datetime-local" class="company-text-input"
              [(ngModel)]="formData[field.name]" [name]="field.name" [disabled]="readOnly" />
 
         




          <div class="field-input-area">

            <!-- TEXT / NUMBER / EMAIL -->
            <input *ngIf="field.type === 'text' || field.type === 'number' || field.type === 'email'"
              [type]="field.type" class="company-text-input" [placeholder]="field.placeholder"
              [(ngModel)]="formData[field.name]" [name]="field.name" [disabled]="readOnly" />

            <!-- DATE -->
            <input *ngIf="field.type === 'date'" type="date" class="company-text-input"
              [(ngModel)]="formData[field.name]" [name]="field.name" [disabled]="readOnly" />

              <!-- TIME -->
<input *ngIf="field.type === 'time'"
  type="time"
  class="company-text-input"
  [(ngModel)]="formData[field.name]"
  [name]="field.name" [disabled]="readOnly" />

            <!-- TEXTAREA -->
            <textarea *ngIf="field.type === 'textarea'" class="company-textarea-input" [placeholder]="field.placeholder"
              [(ngModel)]="formData[field.name]" [name]="field.name" [disabled]="readOnly">
            </textarea>

            <!-- STATIC DROPDOWN (🔥 FIXED) -->
            <div [style.display]="field.name === 'customer' && readOnly ? 'flex' : 'block'" [style.gap]="'10px'" [style.align-items]="'center'" [style.width]="'100%'">
              <select *ngIf="field.type === 'select'" 
                [style.flex]="field.name === 'customer' && readOnly ? '1' : 'none'"
                class="company-text-input" 
                [(ngModel)]="formData[field.name]"
                (ngModelChange)="fieldChange.emit({ name: field.name, value: $event }); field.onChange?.($event)"
                [name]="field.name"
                [disabled]="readOnly">

                <option value="">-- Select --</option>
                <option *ngFor="let opt of field.options" [value]="opt.value">
                  {{ opt.label }}
                </option>
              </select>

              <div *ngIf="field.name === 'customer' && readOnly" style="display: flex; gap: 8px;">
                <button type="button" (click)="clickCustomerDetails.emit(formData[field.name])" style="background: #2196f3; color: white; border: none; border-radius: 4px; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;" title="Customer Details">
                  <i class="fas fa-info"></i>
                </button>
                <button type="button" (click)="clickCustomerAction2.emit(formData[field.name])" style="background: #2196f3; color: white; border: none; border-radius: 4px; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;" title="Folder Actions">
                  <i class="fas fa-folder-open"></i>
                </button>
              </div>
            </div>

            <!-- DYNAMIC DROPDOWN (DEPENDENT) -->
            <select *ngIf="field.type === 'select-dynamic'" 
  [(ngModel)]="formData[field.name]"
              (ngModelChange)="
                formData[field.name] = $event;
                fieldChange.emit({ name: field.name, value: $event });
                field.onChange?.($event)
              " [name]="field.name" [disabled]="readOnly">

              <option value="">-- Select --</option>

              <ng-container *ngIf="
                formData[field.dependsOn] &&
                field.optionsMap[formData[field.dependsOn]]
              ">
                <option *ngFor="let opt of field.optionsMap[formData[field.dependsOn]]" [value]="opt.value">
                  {{ opt.label }}
                </option>
              </ng-container>

            </select>

            <!-- CHECKBOX GROUP (🔥 NEW) -->
            <div *ngIf="field.type === 'checkbox'" class="checkbox-group-container">
              <div *ngFor="let opt of field.options" class="checkbox-item">
                <input type="checkbox" [id]="field.name + '_' + opt.value" [ngModel]="formData[field.name][opt.value]"
                  (ngModelChange)="
                    formData[field.name][opt.value] = $event;
                    fieldChange.emit({ name: field.name, value: formData[field.name] })
                  " [name]="field.name + '_' + opt.value" class="company-checkbox-input" [disabled]="readOnly" />
                <label [for]="field.name + '_' + opt.value" class="checkbox-label">
                  {{ opt.label }}
                </label>
              </div>
            </div>

            <!-- RADIO GROUP -->
            <div *ngIf="field.type === 'radio'" class="checkbox-group-container">
              <div *ngFor="let opt of field.options" class="checkbox-item">
                <input type="radio" [id]="field.name + '_' + opt.value" [value]="opt.value"
                  [(ngModel)]="formData[field.name]" [name]="field.name"
                  (ngModelChange)="fieldChange.emit({ name: field.name, value: $event })"
                  class="company-checkbox-input" [disabled]="readOnly" />
                <label [for]="field.name + '_' + opt.value" class="checkbox-label">
                  {{ opt.label }}
                </label>
              </div>
            </div>

          </div>
        </div>


        <!-- ACTION BUTTONS -->
        <div class="form-action-buttons" *ngIf="!readOnly" style="display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap;">

          <button type="submit" class="submit-button">
            <i class="fas fa-check"></i> {{ submitButtonText }}
          </button>

          <button type="button" class="cancel-button" (click)="cancel()">
            <i class="fas fa-times"></i> {{ cancelButtonText }}
          </button>
        </div>

      </form>
    </div>


  </div>
</div>
