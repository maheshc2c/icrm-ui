<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<div class="form-wrapper" (click)="hostClick()">
  <div class="company-form-container">

    <!-- Form title removed per user request -->

    <div class="form-body-section">
      <form #form="ngForm" (ngSubmit)="submit(form)">

        <div class="form-grid-container">
          <!-- LOOP ALL FIELDS -->
          <ng-container *ngFor="let field of fields">
            <div class="company-field-row" 
                 [class.full-width]="field.type === 'textarea'">

              <!-- LABEL -->
            <label class="field-label-text">
              {{ field.label }}
              <span *ngIf="field.required" class="mandatory-star">*</span>
            </label>

            <div class="field-input-area">

              <!-- TEXT / NUMBER / EMAIL -->
              <input *ngIf="field.type === 'text' || field.type === 'number' || field.type === 'email'"
                [type]="field.type" class="company-text-input" [placeholder]="field.placeholder || ''"
                [(ngModel)]="formData[field.name]" [name]="field.name" [required]="field.required" 
                [pattern]="field.pattern || '.*'"
                (ngModelChange)="onFieldInput(field.name); fieldChange.emit({ name: field.name, value: $event }); field.onChange?.($event)" />

              <!-- DATE -->
              <input *ngIf="field.type === 'date'" type="date" class="company-text-input"
                [(ngModel)]="formData[field.name]" [name]="field.name" [required]="field.required"
                (ngModelChange)="onFieldInput(field.name); fieldChange.emit({ name: field.name, value: $event }); field.onChange?.($event)" />

              <!-- TIME -->
<input *ngIf="field.type === 'time'"
  type="time"
  class="company-text-input"
  [(ngModel)]="formData[field.name]"
  [name]="field.name"
  (ngModelChange)="onFieldInput(field.name); fieldChange.emit({ name: field.name, value: $event }); field.onChange?.($event)" />

            <!-- TEXTAREA -->
            <textarea *ngIf="field.type === 'textarea'" class="company-textarea-input" [placeholder]="field.placeholder"
              [(ngModel)]="formData[field.name]" [name]="field.name"
              (ngModelChange)="onFieldInput(field.name); fieldChange.emit({ name: field.name, value: $event }); field.onChange?.($event)">
            </textarea>

            <!-- STATIC DROPDOWN (🔥 FIXED) -->
            <select *ngIf="field.type === 'select'"
  class="company-text-input"
  [(ngModel)]="formData[field.name]"
  (ngModelChange)="onFieldInput(field.name); fieldChange.emit({ name: field.name, value: $event }); field.onChange?.($event)"
  [name]="field.name">

  <option [ngValue]="null">
  {{ field.placeholder }}
</option>

  <option *ngFor="let opt of field.options" [value]="opt.value">
    {{ opt.label }}
  </option>

</select>

              <!-- DYNAMIC DROPDOWN (DEPENDENT) -->
              <select *ngIf="field.type === 'select-dynamic'" 
                class="company-text-input"
                [(ngModel)]="formData[field.name]"
                (ngModelChange)="
                  onFieldInput(field.name);
                  formData[field.name] = $event;
                  fieldChange.emit({ name: field.name, value: $event });
                  field.onChange?.($event)
                " [name]="field.name" [required]="field.required">

                <option value="">-- Select --</option>

                <ng-container *ngIf="
                  formData[field.dependsOn] &&
                  field.optionsMap[formData[field.dependsOn]]
                ">
                  <option *ngFor="let opt of field.optionsMap[formData[field.dependsOn]]" [value]="opt.value">
                    {{ opt.label }}
                  </option>
                </ng-container>

              </select>
              <!-- CHECKBOX GROUP (🔥 NEW) -->
              <div *ngIf="field.type === 'checkbox'" class="checkbox-group-container">
                <div *ngFor="let opt of field.options" class="checkbox-item">
                  <input type="checkbox" [id]="field.name + '_' + opt.value" 
                    [ngModel]="getCheckboxValue(field.name, opt.value)"
                    (ngModelChange)="onCheckboxChange(field.name, opt.value, $event); onFieldInput(field.name)"
                    [name]="field.name + '_' + opt.value" class="company-checkbox-input" />
                  <label [for]="field.name + '_' + opt.value" class="checkbox-label">
                    {{ opt.label }}
                  </label>
                </div>
              </div>

              <!-- RADIO GROUP -->
              <div *ngIf="field.type === 'radio'" class="checkbox-group-container">
                <div *ngFor="let opt of field.options" class="checkbox-item">
                  <input type="radio" [id]="field.name + '_' + opt.value" [value]="opt.value"
                    [(ngModel)]="formData[field.name]" [name]="field.name"
                    (ngModelChange)="onFieldInput(field.name); fieldChange.emit({ name: field.name, value: $event })"
                    class="company-checkbox-input" />
                  <label [for]="field.name + '_' + opt.value" class="checkbox-label">
                    {{ opt.label }}
                  </label>
                </div>
              </div>

              <!-- VALIDATION ERROR FOR ALL FIELDS -->
              <div *ngIf="errors[field.name]" class="validation-error">
                {{ errors[field.name] }}
              </div>

            </div>
            </div>
          </ng-container>
        </div>

        <!-- BUTTONS -->
        <div class="form-action-buttons">
          <button type="button" class="btn-cancel-form" (click)="cancel()">
            <i class="fas fa-times"></i> Cancel
          </button>
          <button type="submit" class="btn-submit-form">
            <i class="fas fa-check"></i> Save
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
