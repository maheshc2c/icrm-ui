<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<div class="form-wrapper" (click)="hostClick()">
  <div class="company-form-container">

    <!-- Form title removed per user request -->

    <div class="form-body-section">
      <form #form="ngForm" (ngSubmit)="submit(form)">

        <div class="form-grid-container">
          <!-- LOOP ALL FIELDS -->
          <ng-container *ngFor="let field of fields">
            <div class="company-field-row"
                 [class.full-width]="field.type === 'textarea'">

              <!-- LABEL -->
            <label class="field-label-text">
              {{ field.label }}
              <span *ngIf="field.required" class="mandatory-star">*</span>
            </label>

            <div class="field-input-area">

              <!-- TEXT / NUMBER / EMAIL -->
              <input *ngIf="field.type === 'text' || field.type === 'number' || field.type === 'email'"
                [type]="field.type" class="company-text-input" [placeholder]="field.placeholder || ''"
                [(ngModel)]="formData[field.name]" [name]="field.name" [required]="field.required"
                [pattern]="field.pattern || '.*'"
                [id]="'form-field-' + field.name"
                (ngModelChange)="onFieldInput(field.name); fieldChange.emit({ name: field.name, value: $event }); field.onChange?.($event)" />

              <!-- DATE / DATETIME -->
              <!-- <input *ngIf="field.type === 'date' || field.type === 'datetime-local'" [type]="field.type" class="company-text-input"
                [ngModel]="formData[field.name]" (ngModelChange)="onInputChange(field, $event)"
                [name]="field.name" [required]="!!field.required" /> -->

              <!-- TIME -->
              <input *ngIf="field.type === 'time'"
                type="time"
                class="company-text-input"
                [(ngModel)]="formData[field.name]"
                [name]="field.name"
                [id]="'form-field-' + field.name"
                (ngModelChange)="onFieldInput(field.name); fieldChange.emit({ name: field.name, value: $event }); field.onChange?.($event)" />

                <!-- DATE TIME -->
<input
    *ngIf="field.type === 'datetime-local'"
    type="datetime-local"
    class="company-text-input"
    [(ngModel)]="formData[field.name]"
    [name]="field.name"
    [required]="field.required"
    [id]="'form-field-' + field.name"
    (ngModelChange)="
      onFieldInput(field.name);
      fieldChange.emit({ name: field.name, value: $event });
      field.onChange?.($event)
    " />



              <!-- TEXTAREA -->
              <textarea *ngIf="field.type === 'textarea'" class="company-textarea-input" [placeholder]="field.placeholder || ''"
                [(ngModel)]="formData[field.name]" [name]="field.name"
                [id]="'form-field-' + field.name"
                (ngModelChange)="onFieldInput(field.name); fieldChange.emit({ name: field.name, value: $event }); field.onChange?.($event)">
              </textarea>

              <!-- STATIC DROPDOWN -->
              <select *ngIf="field.type === 'select'"
                class="company-text-input"
                [(ngModel)]="formData[field.name]"
                (ngModelChange)="onFieldInput(field.name); fieldChange.emit({ name: field.name, value: $event }); field.onChange?.($event)"
                [name]="field.name"
                [id]="'form-field-' + field.name">
                <option [ngValue]="null">-- {{ field.placeholder || 'Select' }} --</option>
                <option *ngFor="let opt of (field._filtered || field.options)" [value]="opt.value">
                  {{ opt.label }}
                </option>
              </select>

 
              <select *ngIf="field.type === 'select-dynamic'"
                class="company-text-input"
                [(ngModel)]="formData[field.name]"
                (ngModelChange)="
                  onFieldInput(field.name);
                  formData[field.name] = $event;
                  fieldChange.emit({ name: field.name, value: $event });
                  field.onChange?.($event)
                " [name]="field.name" [required]="!!field.required"
                [id]="'form-field-' + field.name">

                <option value="">-- Select --</option>

                <ng-container *ngIf="
                  formData[field.dependsOn] &&
                  field.optionsMap[formData[field.dependsOn]]
                ">
                  <option *ngFor="let opt of field.optionsMap[formData[field.dependsOn]]" [value]="opt.value">
                    {{ opt.label }}
                  </option>
                </ng-container>

              </select>

              <!-- FILE UPLOAD -->
              <div *ngIf="field.type === 'file'" class="file-upload-input-container" style="display: flex; flex-direction: column; gap: 4px; width: 100%;">
                <div class="company-text-input" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 6px 12px; border: 1px solid #e0e0e0; border-radius: 4px; background: #fdfdfd; cursor: pointer;" (click)="fileInput.click()">
                  <input type="file"
                    style="display: none;"
                    #fileInput
                    [id]="'form-field-' + field.name"
                    [name]="field.name"
                    (change)="onFileChange(field.name, $event)" />
                  <button type="button" 
                    style="background: #f1f1f1; border: 1px solid #ccc; border-radius: 3px; padding: 4px 10px; font-size: 13px; color: #333; cursor: pointer; font-weight: normal;">
                    Choose File
                  </button>
                  <span style="font-size: 13px; color: #555; font-weight: normal;">
                    {{ formData[field.name]?.name || formData[field.name] || 'No file chosen' }}
                  </span>
                </div>
                <div style="font-size: 12px; color: #666; margin-top: 2px; font-weight: normal; text-align: left;">
                  (Allowed types: jpg, png, gif, pdf, doc, docx, xls, xlsx Max size:4MB)
                </div>
              </div>

              <!-- SEARCHABLE MULTISELECT DROPDOWN -->
              <div *ngIf="field.type === 'checkbox'" class="custom-dropdown-container" [id]="'form-field-' + field.name">
                <div class="dropdown-trigger" 
                     [class.active]="field._open"
                     (click)="field._open = !field._open; $event.stopPropagation()">
                  <span class="trigger-text" style="font-weight: normal; font-size: 14px;">
                    {{ getMultiselectLabel(field) || (field.placeholder || '-- Select Roles --') }}
                  </span>
                  <i class="fas fa-chevron-down arrow-icon"></i>
                </div>

                <!-- DROPDOWN PANEL -->
                <div class="dropdown-panel" *ngIf="field._open" (click)="$event.stopPropagation()">
                  <div class="search-box-wrapper" style="padding: 10px;">
                    <input type="text" 
                      class="dropdown-search-input" 
                      [placeholder]="'Search...'"
                      #searchBox
                      (input)="onSearchInput(field, searchBox.value)">
                  </div>

                  <ul class="options-list" style="padding: 6px 0; list-style: none;">
                    <li class="option-item" 
                        *ngFor="let opt of (field._filtered || field.options)"
                        style="display: flex; align-items: center; gap: 8px; padding: 6px 12px;"
                        (click)="$event.stopPropagation()">
                      <input type="checkbox" 
                        [id]="field.name + '_' + opt.value"
                        [ngModel]="getCheckboxValue(field.name, opt.value)"
                        (ngModelChange)="onCheckboxChange(field.name, opt.value, $event); onFieldInput(field.name)"
                        [name]="field.name + '_' + opt.value" 
                        class="company-checkbox-input" />
                      <label [for]="field.name + '_' + opt.value" class="checkbox-label" style="margin-bottom: 0; cursor: pointer; font-size: 13px; font-weight: normal;">
                        {{ opt.label }}
                      </label>
                    </li>
                    <li class="no-results" *ngIf="(field._filtered || field.options)?.length === 0" style="padding: 10px 15px; text-align: center; color: #999; font-size: 13px;">
                      No results found
                    </li>
                  </ul>
                </div>
              </div>

              <!-- RADIO GROUP -->
              <div *ngIf="field.type === 'radio'" class="checkbox-group-container" [id]="'form-field-' + field.name">
                <div *ngFor="let opt of field.options" class="checkbox-item">
                  <input type="radio" [id]="field.name + '_' + opt.value" [value]="opt.value"
                    [(ngModel)]="formData[field.name]" [name]="field.name"
                    (click)="onRadioClick(field.name, opt.value, $event)"
                    (ngModelChange)="fieldChange.emit({ name: field.name, value: $event })"
                    class="company-checkbox-input" />
                  <label [for]="field.name + '_' + opt.value" class="checkbox-label">
                    {{ opt.label }}
                  </label>
                </div>
              </div>
 

              <!-- VALIDATION ERROR FOR ALL FIELDS -->
              <div *ngIf="errors[field.name]" class="validation-error">
                {{ errors[field.name] }}
              </div>

            </div>
            </div>
          </ng-container>
        </div>



        <!-- BUTTONS -->
        <div class="form-action-buttons">
          <button type="button" class="btn-cancel-form" (click)="cancel()">
            <i class="fas fa-times"></i> Cancel
          </button>
          <button type="submit" class="btn-submit-form">
            <i class="fas fa-check"></i> Save
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
