<div class="search-group mb-3" (click)="hostClick()">

  <ng-container *ngFor="let field of fields">
    <div class="search-field">

      <label class="search-label" *ngIf="field.label">{{ field.label }}</label>

    <!-- 🔹 INPUT FIELD -->
    <input
      *ngIf="field.type !== 'select' && field.type !== 'native-select'"
      class="form-control"
      [name]="field.key"
      [type]="field.type || 'text'"
      [placeholder]="field.placeholder"
      [value]="values[field.key] || ''"
      (input)="onTextInput(field.key, $event)" />

    <!-- 🔹 NATIVE DROPDOWN -->
    <select *ngIf="field.type === 'native-select'" 
            class="form-control" 
            [(ngModel)]="values[field.key]" 
            (ngModelChange)="onInput(field.key)">
      <option [ngValue]="null">-- {{ field.placeholder || 'Select' }} --</option>
      <option *ngFor="let opt of field.options" [ngValue]="opt.value">{{ opt.label }}</option>
    </select>

    <!-- 🔹 CUSTOM SEARCHABLE DROPDOWN -->
    <div *ngIf="field.type === 'select'" class="custom-dropdown-container">
      <div class="dropdown-trigger" 
           [class.active]="openDropdown === field.key"
           (click)="toggleDropdown(field.key, $event)">
        <span class="trigger-text">
          {{ getSelectedLabel(field) || (field.placeholder || 'Select')}}
        </span>
        <i class="fas fa-chevron-down arrow-icon"></i>
      </div>

      <!-- DROPDOWN PANEL (Visible only when open) -->
      <div class="dropdown-panel" *ngIf="openDropdown === field.key" (click)="$event.stopPropagation()">
        <div class="search-box-wrapper" *ngIf="field.searchable !== false"> <!-- Default to searchable -->
          <div class="search-panel">
            <div class="search-input-wrapper">
              <input type="text" 
                     class="dropdown-search-input" 
                     [placeholder]="'Search...'"
                     (input)="filterDropdownOptions(field, $event)">
            </div>
            <div class="search-helper-text">Please enter 1 or more characters</div>
          </div>
        </div>

        <ul class="options-list">
          <li class="option-item" (click)="selectOption(field, {label: field.placeholder || 'Select', value: null})">
            -- {{ field.placeholder || 'Select' }} --
          </li>
          <li class="no-results" *ngIf="field._loading">Loading...</li>
          <li class="option-item" 
              *ngFor="let opt of (field._filtered || field.options)" 
              (click)="selectOption(field, opt)">
            {{ opt.label }}
          </li>
          <li class="no-results" *ngIf="!field._loading && (field._filtered || field.options)?.length === 0">No results found</li>
        </ul>
      </div>
    </div>

    </div>
  </ng-container>

</div>
