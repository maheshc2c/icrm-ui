<div class="filter-actions icon-actions toolbar-container mb-3">
  <!-- SEARCH -->
  <button *ngIf="showSearch"
          class="icon-btn"
          (click)="search.emit()"
          title="Search">
    <i class="fas fa-search" aria-hidden="true"></i>
  </button>


  <!-- IMPORT -->
  <button *ngIf="showDownload"
          class="icon-btn"
          
          (click)="download.emit()"
          title="Download CSV">
    <i class="fas fa-cloud-download-alt" aria-hidden="true"></i>
     <!-- <i class="fas fa-file-excel" aria-hidden="true"></i> -->
  </button>

  <button *ngIf="showUpload"
        class="icon-btn"
        (click)="upload.emit()"
        title="Upload Target">
  <i class="fas fa-upload"></i>
</button>
  


  <!-- ADD -->
  <button *ngIf="showAdd"
          class="icon-btn"
          (click)="add.emit()"
          title="Add New">
    <i class="fas fa-plus" aria-hidden="true"></i>
  </button>


  <!-- REFRESH -->
  <button *ngIf="showRefresh"
          class="icon-btn"
          (click)="refresh.emit()"
          title="Refresh">
    <i class="fas fa-sync" aria-hidden="true"></i>
  </button>

  <!-- RESET -->
  <button *ngIf="showReset"
          class="icon-btn"
          (click)="reset.emit()"
          title="Reset">
    <i class="fas fa-undo" aria-hidden="true"></i>
  </button>

  <!-- BULK UPLOAD -->
  <button *ngIf="showBulkUpload"
          class="btn btn-secondary"
          (click)="bulkUpload.emit()"
          title="Bulk Upload">
    <i class="fas fa-cloud-upload"></i> Bulk Upload
  </button>

  <!-- SUBMIT -->
  <button *ngIf="showSubmit"
          class="btn btn-submit"
          (click)="submit.emit()"
          title="Submit">
    Submit
  </button>

</div>
