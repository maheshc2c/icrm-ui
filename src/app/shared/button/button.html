<div class="filter-actions icon-actions toolbar-container mb-3">
  <!-- SEARCH -->
  <button *ngIf="showSearch"
          class="icon-btn"
          (click)="search.emit()"
          title="Search">
    <i class="fas fa-search" aria-hidden="true"></i>
  </button>


  <!-- IMPORT -->
  <button *ngIf="showDownload"
          class="icon-btn"
          (click)="download.emit()"
          title="Download CSV">
    <i class="fas fa-cloud-download-alt" aria-hidden="true"></i>
     <!-- <i class="fas fa-file-excel" aria-hidden="true"></i> -->
  </button>


  <!-- ADD -->
  <button *ngIf="showAdd"
          class="icon-btn"
          (click)="add.emit()"
          title="Add New">
    <i class="fas fa-plus" aria-hidden="true"></i>
  </button>


  <!-- RESET -->
  <button *ngIf="showReset"
          class="icon-btn"
          (click)="reset.emit()"
          title="Reset">
    <i class="fas fa-undo" aria-hidden="true"></i>
  </button>
</div>
